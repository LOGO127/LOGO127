<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LOGO127 — AI Systems and LLM Engineering</title>
  <desc id="desc">A dark blue gradient banner with a network of connected nodes and a concise open-source engineering statement.</desc>
  <defs>
    <linearGradient id="background" x1="64" y1="22" x2="1132" y2="286" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#101D3D"/>
      <stop offset="1" stop-color="#241445"/>
    </linearGradient>
    <linearGradient id="accent" x1="760" y1="62" x2="1110" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="0" cy="0" r="1" gradientTransform="translate(935 130) rotate(90) scale(176 250)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="0" cy="0" r="1" gradientTransform="translate(1082 238) rotate(90) scale(120 208)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#93C5FD" stroke-opacity="0.055"/>
    </pattern>
    <filter id="node-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="24" fill="url(#glow-cyan)"/>
  <rect width="1200" height="300" rx="24" fill="url(#glow-violet)"/>
  <rect x="1" y="1" width="1198" height="298" rx="23" stroke="#7DD3FC" stroke-opacity="0.18" stroke-width="2"/>

  <g opacity="0.58">
    <path d="M748 189L824 116L896 151L959 80L1031 127L1125 71" stroke="url(#accent)" stroke-width="2"/>
    <path d="M824 116L834 224L923 242L1031 127L1094 209" stroke="url(#accent)" stroke-width="2"/>
    <path d="M896 151L923 242M959 80L1094 209M1031 127L1125 71" stroke="#A5F3FC" stroke-opacity="0.38"/>
    <circle cx="748" cy="189" r="7" fill="#22D3EE" filter="url(#node-glow)"/>
    <circle cx="824" cy="116" r="9" fill="#38BDF8" filter="url(#node-glow)"/>
    <circle cx="834" cy="224" r="6" fill="#60A5FA"/>
    <circle cx="896" cy="151" r="6" fill="#93C5FD"/>
    <circle cx="923" cy="242" r="8" fill="#818CF8" filter="url(#node-glow)"/>
    <circle cx="959" cy="80" r="7" fill="#67E8F9"/>
    <circle cx="1031" cy="127" r="10" fill="#A78BFA" filter="url(#node-glow)"/>
    <circle cx="1094" cy="209" r="7" fill="#C4B5FD"/>
    <circle cx="1125" cy="71" r="5" fill="#E0E7FF"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="72" y="106" fill="#F8FAFC" font-size="54" font-weight="760" letter-spacing="1">LOGO127</text>
    <text x="74" y="148" fill="#7DD3FC" font-size="18" font-weight="650" letter-spacing="3.2">AI SYSTEMS · LLM TRAINING · INFERENCE</text>
    <text x="74" y="196" fill="#CBD5E1" font-size="18" font-weight="430">Small diffs. Reproducible evidence. Useful upstream work.</text>

    <g font-size="13" font-weight="650" letter-spacing="1.1">
      <rect x="73" y="225" width="104" height="34" rx="17" fill="#0EA5E9" fill-opacity="0.13" stroke="#38BDF8" stroke-opacity="0.42"/>
      <text x="91" y="247" fill="#BAE6FD">PYTORCH</text>
      <rect x="190" y="225" width="137" height="34" rx="17" fill="#3B82F6" fill-opacity="0.12" stroke="#60A5FA" stroke-opacity="0.40"/>
      <text x="208" y="247" fill="#BFDBFE">DISTRIBUTED</text>
      <rect x="340" y="225" width="145" height="34" rx="17" fill="#8B5CF6" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.40"/>
      <text x="358" y="247" fill="#DDD6FE">OPEN SOURCE</text>
    </g>
  </g>
</svg>
